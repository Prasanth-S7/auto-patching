- name: "Auto Patching Playbook"
  gather_facts: true
  hosts: all
  become: true
  become_user: root
  become_method: sudo
  vars_files:
    - vars/main.yml
  vars:
    report_dir: "{{ local_dir }}/sanity-reboot"
    report_file: "{{ report_dir }}/{{ inventory_hostname }}_status.json"

  roles:
    - pre_check
    - stop_services
    - sanity_reboot
    - check_services

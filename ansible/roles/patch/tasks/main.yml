---
- block:

    - name: "Update all packages"
      ansible.builtin.apt:
        update_cache: yes
        upgrade: yes
      register: patch_result

    - name: "Patch result"
      ansible.builtin.debug:
        var: patch_result

    - name: "Store complete patch result"
      ansible.builtin.copy:
        content: "{{ patch_result | to_nice_json }}"
        dest: "/tmp/ansible/patch.{{ inventory_hostname }}.json"
      delegate_to: localhost
      become: false

  rescue:
    - name: "Store patch failure"
      ansible.builtin.copy:
        content: "{{ patch_result | to_nice_json }}"
        dest: "/tmp/ansible/patch.{{ inventory_hostname }}.FAILED.json"
      delegate_to: localhost
      become: false

    - name: "Display patch failure"
      ansible.builtin.debug:
        msg: "Package update failed on {{ inventory_hostname }}"

    - name: "Fail the play"
      ansible.builtin.fail:
        msg: >-
          Patching failed on {{ inventory_hostname }}.
          Please check the APT configuration and repository connectivity.
---
- block:

    - name: "Update all packages"
      ansible.builtin.apt:
        update_cache: yes
        upgrade: yes
      register: patch_result

    - name: "Patch result"
      ansible.builtin.debug:
        var: patch_result

    - name: "Record successful patch result"
      ansible.builtin.set_fact:
        patch_report: >-
          {{
            patch_report | default({}) | combine({
              'patch_status': {
                'status': 'success',
                'result': patch_result
              }
            }, recursive=True)
          }}

  rescue:
    - name: "Record failed patch result"
      ansible.builtin.set_fact:
        patch_report: >-
          {{
            patch_report | default({}) | combine({
              'patch_status': {
                'status': 'failed',
                'result': patch_result | default({})
              }
            }, recursive=True)
          }}

    - name: "Send failed patch report to Lambda"
      ansible.builtin.include_role:
        name: send_report
      vars:
        report_stage: patching
        report_stage_status: failed

    - name: "Display patch failure"
      ansible.builtin.debug:
        msg: "Package update failed on {{ inventory_hostname }}"

    - name: "Fail the play"
      ansible.builtin.fail:
        msg: >-
          Patching failed on {{ inventory_hostname }}.
          Please check the APT configuration and repository connectivity.

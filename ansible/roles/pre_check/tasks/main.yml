- block:
  - name: "Check if not a RHEL or openSUSE server"
    lineinfile:
      line: "HOSTNAME: {{ inventory_hostname }} | Not a RHEL or openSUSE server"
      dest: "{{ local_dir }}/update.{{ inventory_hostname }}.FAILED"
      create: yes
    when: ansible_distribution not in supported_distros
    delegate_to: localhost

  - name: "Fail host if is not RHEL or openSUSE "
    fail:
      msg: "HOSTNAME: {{ inventory_hostname }} | Not a RHEL or Centos server"
    when: ansible_distribution not in supported_distros

- name: "Check if the server is reachable"
  ping:
  register: ping_result
  ignore_errors: yes

- name: "Fail host if not reachable"
  fail:
    msg: "HOSTNAME: {{ inventory_hostname }} | Server is not reachable"
  when: ping_result is failed

- name: "Stop the necessary services before rebooting"
  shell: systemctl list-units --type=service | grep -E 'tomcat.service|apache2.service'
  register: services

